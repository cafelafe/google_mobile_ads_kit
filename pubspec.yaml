name: dartnative_mobile_ads
description: >
  Google Mobile Ads (AdMob) for DartNative apps (iOS + Android).
  Wraps the native Google Mobile Ads SDKs via pure FFI — zero Flutter platform channels.
  API surface follows google_mobile_ads for easy migration.
version: 0.1.0
homepage: https://github.com/cafelafe/dartnative_mobile_ads
repository: https://github.com/cafelafe/dartnative_mobile_ads

environment:
  sdk: ^3.12.0-192.0.dev

dependencies:
  # The engine package. Not imported by the full-screen formats — those are
  # pure FFI — but required from the banner work on, which extends
  # NativeElement. `dn pub get` resolves it from the installed SDK.
  dartnative: ^1.0.0
  ffi: ^2.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0

dartnative:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      android:
        # NOT ffiPlugin: an ffi-only Android plugin is never added to
        # GeneratedPluginRegistrant, so DartNativeMobileAdsPlugin.onAttachedToEngine
        # (which System.loadLibrary's libdartnative_mobile_ads.so) never runs and
        # the ad callbacks' reverse-JNI crashes with UnsatisfiedLinkError.
        # Declaring pluginClass registers the plugin (the .so is still built by the
        # module's own CMakeLists). Mirrors dartnative_firebase / dartnative_webview.
        package: com.dartnative.mobile_ads
        pluginClass: DartNativeMobileAdsPlugin
  registrant:
    imports:
      - package:dartnative_mobile_ads/dartnative_mobile_ads.dart
    calls:
      - initializeMobileAdsPlugin();

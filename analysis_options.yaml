# Uses package:lints (declared in pubspec dev_dependencies), not flutter_lints:
# this package does not depend on Flutter.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # Public API is published to dartpub.dev, so document every export.
    - public_member_api_docs
    - always_declare_return_types
    - prefer_final_locals
    - unawaited_futures
